name: Doppel
options:
  bundleIdPrefix: com.doppel
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Doppel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Doppel
        excludes:
          - "Preview Content"
          - "Info.plist"
      - path: Doppel/Preview Content
        buildPhase: none
    info:
      path: Doppel/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doppel.app
        PRODUCT_NAME: Doppel
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Doppel/Preview Content\""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    schemes:
      Doppel:
        build:
          targets:
            Doppel: all
        run:
          config: Debug
        archive:
          config: Release
